<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Infographic Generator 2027</title><style>*{box-sizing:border-box}body{margin:0;background:#0c192b;color:#eef3fa;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}h1,h2,a{color:#e4c17b}section{background:#172a43;border:1px solid #54617a;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:block}input,select,textarea,button{display:block;width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #68768a;background:#0c192b;color:white}button{background:#e4c17b;color:#102039;font-weight:bold;cursor:pointer}textarea{min-height:100px}#out{min-height:420px}small{color:#d1dbea}</style><main><a href="../">← คลังเรียนรู้ไปด้วยกัน</a><h1>SMART INFOGRAPHIC GENERATOR 2027</h1><p>V1.0 — Knowledge &amp; Viral Edition</p><section><form id="f"><div class="grid"><label>หัวข้อหลัก<input id="topic" required placeholder="เช่น อยากมีรถในฝัน ต้องวางแผนอย่างไร"></label><label>กลุ่มเป้าหมาย<input id="aud" value="ประชาชนทั่วไป"></label><label>ประเภทเนื้อหา<select id="kind"><option>ความรู้ทั่วไป</option><option>การเงิน</option><option>ยานยนต์</option><option>เทคโนโลยี</option><option>สุขภาพ</option><option>ประชาสัมพันธ์ราชการ</option><option>วิธีปฏิบัติ</option></select></label><label>จำนวนสาระ<select id="count"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></label><label>สไตล์<select id="style"><option>Premium Editorial + 3D</option><option>Minimal</option><option>Modern Educational</option><option>Luxury Cinematic</option><option>ทางการ</option></select></label><label>โทนสี<input id="color" value="Dark Navy + Gold"></label><label>สัดส่วน<select id="ratio"><option>4:5 Facebook</option><option>9:16 Story</option><option>16:9 Presentation</option><option>1:1 Social</option></select></label><label>ภาษา<select id="lang"><option>ไทย</option><option>อังกฤษ</option><option>ไทยและอังกฤษ</option></select></label></div><label>บทบาทภาพอ้างอิง (แนบภาพจริงในแชต AI)<textarea id="refs" placeholder="ภาพ 1 สินค้า / ภาพ 2 บุคคล"></textarea></label><label>ข้อมูลและแหล่งอ้างอิง<textarea id="sources" placeholder="ใส่ข้อมูลที่เผยแพร่ได้ หรือ URL แหล่งข้อมูล"></textarea></label><label>เครดิตบนภาพ (ไม่บังคับ)<input id="credit"></label><label>ขั้นตอนตรวจสอบ<select id="mode"><option>ตรวจข้อมูลและรออนุมัติก่อนสร้างภาพ</option><option>สร้างภาพเมื่อข้อมูลยืนยันครบแล้ว</option></select></label><button type="submit">สร้าง Prompt</button></form></section><section><h2>Master Prompt</h2><textarea id="out" readonly></textarea><button id="copy">คัดลอก Prompt</button><p id="status" role="status"></p><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">เปิด ChatGPT</a></section><small>ไม่อัปโหลดภาพหรือข้อมูลจากหน้านี้ ใช้เฉพาะภาพที่ได้รับอนุญาต ห้ามส่งข้อมูลลับ ตรวจภาษาและข้อเท็จจริงก่อนเผยแพร่</small><p>งานแผนงานและงบประมาณ (ศทส.กก.ตชด.23)</p></main><script>const $=id=>document.getElementById(id),v=id=>$(id).value.trim();$('f').onsubmit=e=>{e.preventDefault();$('out').value=['บทบาท: บรรณาธิการความรู้และนักออกแบบอินโฟกราฟิกมืออาชีพ','หัวข้อ: '+v('topic'),'กลุ่มเป้าหมาย: '+v('aud'),'ประเภท: '+v('kind'),'จำนวนสาระ: '+v('count'),'สไตล์: '+v('style'),'โทนสี: '+v('color'),'สัดส่วน: '+v('ratio'),'ภาษา: '+v('lang'),'ภาพอ้างอิง: '+(v('refs')||'ไม่มีข้อกำหนดเฉพาะ'),'ข้อมูลต้นฉบับ: '+(v('sources')||'ค้นจากแหล่งน่าเชื่อถือหากทำได้'),'เครดิต: '+(v('credit')||'ไม่ใส่'),'ขั้นตอน: '+v('mode'),'ตรวจสอบแหล่งข้อมูลจริง ชื่อ ตัวเลข หน่วย วันที่ และข้อกล่าวอ้างก่อนสร้างภาพ หากเข้าถึงแหล่งไม่ได้หรือข้อมูลไม่ครบ ให้แจ้งและถามก่อน ห้ามสร้างแหล่งอ้างอิงหรือข้อมูลขึ้นเอง แยกข้อเท็จจริงจากคำแนะนำ ไม่รับประกันผลลัพธ์ทางการเงินหรือสุขภาพ','หากระบุภาพอ้างอิงแต่ยังไม่แนบ ให้ขอภาพก่อน รักษาใบหน้าและสัดส่วนตามภาพจริง ไม่สลับบุคคล ไม่สื่อว่าบุคคลรับรองสินค้าโดยไม่มีหลักฐาน','จัดทำ Hook ที่ไม่เกินจริง สาระหลักตามจำนวนที่เลือก Practical Tips ตามความเหมาะสม Key Takeaway และคำถามชวนสนทนา ใช้ตัวอย่างสมมติเฉพาะที่ระบุชัดเจน','ออกแบบ Stop Scrolling ด้วยลำดับสายตาชัดเจน ตัวอักษรใหญ่ อ่านง่ายบนมือถือ มีพื้นที่ว่าง ไอคอนหรือภาพประกอบตรงเนื้อหา ไม่ใส่ข้อความซ้ำ','ก่อนสร้างภาพ แสดงข้อความที่จะใช้และแหล่งอ้างอิงแยกจากภาพ หากเลือกโหมดรออนุมัติให้หยุดรอผู้ใช้ยืนยัน หลังสร้างภาพตรวจสะกดภาษาและตัวเลข แจ้งจุดที่ต้องตรวจซ้ำ ระบุภาพสร้างด้วย AI เมื่อเผยแพร่'].join('\n\n');$('status').textContent='สร้างคำสั่งแล้ว'};$('copy').onclick=async()=>{if(!$('out').value)return;try{await navigator.clipboard.writeText($('out').value);$('status').textContent='คัดลอกแล้ว'}catch(e){$('out').select();$('status').textContent='โปรดคัดลอกข้อความที่เลือกด้วยตนเอง'}};</script></html>
