<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPP23 Assistant V0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#0c192b;color:#edf2f8;font:18px system-ui}main{max-width:680px;margin:auto;padding:16px}h1,a{color:#e4c17b}section{background:#15283f;border:1px solid #52647b;border-radius:18px;padding:16px}button,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #a88e59}button{background:#e4c17b;color:#10243d;cursor:pointer}input{background:#0c192b;color:white;min-width:0;flex:1}form,.choices{display:flex;gap:8px;flex-wrap:wrap}#log{height: min(50vh,440px);overflow:auto}p{line-height:1.6;overflow-wrap:anywhere}.msg{background:#203953;padding:12px;border-radius:12px}.user{background:#34445a;margin-left:24px}small{color:#c5d2df}@media(max-width:600px){main{padding:12px}section{padding:12px}button,input{min-height:44px}h1{font-size:26px}} main{padding:10px}h1{font-size:22px}#log{height: min(42vh,300px)} </style><main><small>เรียนรู้ไปด้วยกัน • V0.3 Prototype</small><h1>BPP23 Library Assistant</h1><p>ผู้ช่วยแนะนำเครื่องมือแบบกฎและบริบทในหน้านี้ ไม่ใช่โมเดลภาษา ไม่ส่งข้อความไปยัง API โปรดไม่กรอกข้อมูลส่วนบุคคลหรือข้อมูลภายใน</p><section><div id="log" role="log" aria-live="polite"></div><div class="choices" id="choices"></div><form id="form"><input id="q" aria-label="คำถาม" maxlength="300" required placeholder="พิมพ์คำถาม"><button>ส่ง</button></form><p><button id="reset">เริ่มสนทนาใหม่</button></p></section><p><a href="../../" target="_blank" rel="noopener">เปิดคลังเรียนรู้</a></p></main><script>const topics=[['อินโฟกราฟิก','อินโฟ|infographic|โปสเตอร์|กราฟิก','smart-infographic/','ระบุหัวข้อ กลุ่มเป้าหมาย จำนวนสาระ และสไตล์'],['วิเคราะห์ข้อมูล','สถิติ|วิเคราะห์|กราฟ|analytics','data-analytics/','เตรียมข้อมูลจำลอง ระบุช่วงเวลาและตรวจสอบยอดรวม'],['เทศกาล','เทศกาล|ลอยกระทง|สงกรานต์|festival','festival/','ระบุเทศกาล บรรยากาศ บุคคล และสัดส่วนภาพ'],['วิดีโออาหาร','อาหาร|food|เมนู','food-video/','ระบุเมนู ความยาว และลำดับฉาก'],['รายรับรายจ่าย','บัญชี|รายรับ|รายจ่าย|finance','smart-finance/','ทดลองบันทึกรายการจำลองและสำรองข้อมูล'],['บทเรียน AI','บทเรียน|เรียน|prompt|มือใหม่','learning/','เริ่มจากบทเรียนพื้นฐาน แล้วทดลองคำสั่งกับข้อมูลจำลอง']];const e=x=>document.getElementById(x);let topic=null,stage=0,goal='';function add(s,user=false,path){const p=document.createElement('p');p.className='msg'+(user?' user':'');p.textContent=s;if(path){const a=document.createElement('a');a.href='../../'+path;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' เปิดเครื่องมือ';p.append(a)}e('log').append(p);e('log').scrollTop=e('log').scrollHeight}function choices(items){e('choices').replaceChildren();items.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>answer(s);e('choices').append(b)})}function start(){topic=null;stage=0;goal='';e('log').replaceChildren();add('สวัสดีครับ วันนี้ต้องการทำงานประเภทใด?');choices(topics.map(t=>t[0]))}function answer(q){add(q,true);const s=q.toLowerCase();if(/เริ่มใหม่|เปลี่ยนหัวข้อ/.test(s)){start();return}if(/คลิป|วิดีโอ|วีดีโอ|video/.test(s)&&!/อาหาร|food|เมนู/.test(s)){topic=null;stage=0;add('ต้องการสร้างวิดีโอประเภทใดครับ? หากเป็นคลิปอาหารเลือกวิดีโออาหาร หากเป็นคลิปทั่วไปลองดูบทเรียน AI');choices(['วิดีโออาหาร','บทเรียน AI','เปลี่ยนหัวข้อ']);return}const found=topics.find(t=>t[0]===q)||topics.find(t=>t[1].split('|').some(k=>s.includes(k)));if(found&&found!==topic){topic=found;stage=1;add('สนใจ '+topic[0]+' ใช่ไหมครับ ต้องการใช้เพื่ออะไร?');choices(['งานทั่วไป','ฝึกเรียนรู้','งานประชาสัมพันธ์','เปลี่ยนหัวข้อ']);return}if(topic&&/ลิงก์|เปิดเครื่องมือ|วิธีใช้|ทำยังไง/.test(s)){add(topic[3],false,topic[2]);return}if(topic&&stage===1){goal=q;stage=2;add('สำหรับเป้าหมายที่ระบุ: '+goal+' — แนวทางเบื้องต้นคือ '+topic[3],false,topic[2]);choices(['วิธีใช้','เปิดเครื่องมือ','เปลี่ยนหัวข้อ']);return}if(topic){add('ขณะนี้กำลังคุยเรื่อง '+topic[0]+' ครับ ระบบยังตอบคำถามอิสระไม่ได้ ลองเลือกวิธีใช้หรือเปลี่ยนหัวข้อ');return}add('ยังไม่พบหัวข้อที่ตรงกัน กรุณาเลือกหมวดด้านล่าง');}e('form').onsubmit=x=>{x.preventDefault();const q=e('q').value.trim();if(q)answer(q);e('q').value=''};e('reset').onclick=start;start();</script></html>
